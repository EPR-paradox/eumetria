[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eumetria"
version = "0.0.1"
description = "Lithography metrology wafer-field analysis: overlay / focus / CDU"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=8.0", "zernpy>=0.1.2"]
dev = [
    "pip>=24.0",  # uv venv 默认**不带 pip**；要在 PyCharm 里管理包就得有它
    "ruff>=0.6",
    "pytest-cov>=5.0",
]

[project.scripts]
eumetria = "eumetria.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["out", ".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "RET", "SIM", "PTH", "RUF"]
ignore = [
    "E501",    # 行宽交给 formatter，别在 lint 里重复报
    "RUF001",  # 全角标点在中文注释里是刻意的
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E402", "F401"]  # 实验脚本按段落执行，允许先 import 后设路径
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "optional: 需要可选依赖（未安装则 skip）",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eumetria"
version = "0.0.1"
description = "Lithography metrology wafer-field analysis: overlay / focus / CDU"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=8.0", "zernpy>=0.1.2"]

[project.scripts]
eumetria = "eumetria.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "optional: 需要可选依赖（未安装则 skip）",
]
